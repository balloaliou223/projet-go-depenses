{{define "edit_expense.html"}}{{template "header" .}}<div class="form-card"><p class="eyebrow">MODIFICATION</p><h1>Modifier une dépense</h1>{{if .Error}}<div class="error" role="alert">{{.Error}}</div>{{end}}<form method="POST"><label for="amount">Montant (€)</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" value="{{.Amount}}" required><label for="description">Description</label><input id="description" name="description" type="text" maxlength="120" value="{{.Description}}" required><label for="date">Date</label><input id="date" name="date" type="date" value="{{.Date}}" required><label for="category_id">Catégorie</label><select id="category_id" name="category_id" required>{{range .Categories}}<option value="{{.ID}}" {{if eq .ID $.CategoryID}}selected{{end}}>{{.Name}}</option>{{end}}</select><div class="actions"><button class="button" type="submit">Enregistrer</button><a class="button secondary" href="/expenses">Annuler</a></div></form></div>{{template "footer" .}}{{end}}
